<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>윤준영의 숫자 야구</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("number-baseball-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="game-board" aria-label="윤준영의 숫자 야구 게임">
        <div class="topbar">
          <div class="brand">
            <span class="brand-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M7 3.5c2 3.5 2 13.5 0 17" />
                <path d="M17 3.5c-2 3.5-2 13.5 0 17" />
              </svg>
              BASEBALL GAME
            </span>
            <h1>윤준영의 숫자 야구</h1>
          </div>
          <div class="topbar-actions">
            <button
              class="icon-button"
              id="themeToggle"
              type="button"
              aria-label="테마 전환"
              title="테마 전환"
              aria-pressed="false"
            >
              <svg
                class="icon-off"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 256 256"
                fill="currentColor"
              >
                <path
                  d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"
                />
              </svg>
              <svg
                class="icon-on"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 256 256"
                fill="currentColor"
              >
                <path
                  d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"
                />
              </svg>
            </button>
            <button
              class="icon-button"
              id="muteToggle"
              type="button"
              aria-label="효과음 끄기"
              title="효과음 끄기"
              aria-pressed="false"
            >
              <svg
                class="icon-off"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 256 256"
                fill="currentColor"
              >
                <path
                  d="M155.51,24.81a8,8,0,0,0-8.42.88L77.25,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V32A8,8,0,0,0,155.51,24.81ZM32,96H72v64H32ZM144,207.64,88,164.09V91.91l56-43.55Zm54-106.08a40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.58,24,24,0,0,0,0-31.72,8,8,0,0,1,12-10.58ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z"
                />
              </svg>
              <svg
                class="icon-on"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 256 256"
                fill="currentColor"
              >
                <path
                  d="M53.92,34.62A8,8,0,1,0,42.08,45.38L73.55,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V175.09l42.08,46.29a8,8,0,1,0,11.84-10.76ZM32,96H72v64H32ZM144,207.64,88,164.09V95.89l56,61.6Zm42-63.77a24,24,0,0,0,0-31.72,8,8,0,1,1,12-10.57,40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.59Zm-80.16-76a8,8,0,0,1,1.4-11.23l39.85-31A8,8,0,0,1,160,32v74.83a8,8,0,0,1-16,0V48.36l-26.94,21A8,8,0,0,1,105.84,67.91ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <section class="settings-panel">
          <div class="settings-controls">
            <div class="segment-pill-group" role="tablist" aria-label="자리수 선택">
              <button class="segment is-active" type="button" data-length="3">
                3자리
              </button>
              <button class="segment" type="button" data-length="4">4자리</button>
            </div>
            <button
              class="new-game-btn"
              id="newGameButton"
              type="button"
              aria-label="새 게임"
              title="새 게임"
            >
              <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
              </svg>
              <span>새 게임</span>
            </button>
          </div>

          <div class="settings-options">
            <label class="toggle-switch">
              <input id="allowZeroToggle" type="checkbox" checked />
              <span class="switch-track" aria-hidden="true">
                <span class="switch-thumb"></span>
              </span>
              <span class="switch-label">0 포함</span>
            </label>

            <div
              class="radio-group"
              id="attemptsGroup"
              role="radiogroup"
              aria-label="기회"
            >
              <span class="radio-group-title">기회</span>
              <label class="radio-chip">
                <input type="radio" name="maxAttempts" value="10" checked />
                <span>10회</span>
              </label>
              <label class="radio-chip">
                <input type="radio" name="maxAttempts" value="15" />
                <span>15회</span>
              </label>
              <label class="radio-chip">
                <input type="radio" name="maxAttempts" value="20" />
                <span>20회</span>
              </label>
            </div>
          </div>
        </section>

        <div class="field-panel">
          <svg
            class="field-art"
            viewBox="0 0 320 220"
            focusable="false"
            aria-hidden="true"
          >
            <defs>
              <!-- Deep Stadium Grass with Center Spotlight -->
              <radialGradient id="fieldGrassGrad" cx="50%" cy="58%" r="70%">
                <stop offset="0%" stop-color="#1f7a47" />
                <stop offset="55%" stop-color="#145e35" />
                <stop offset="100%" stop-color="#093019" />
              </radialGradient>
              <!-- Rich Infield Dirt Gradient -->
              <linearGradient id="infieldDirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ddaa68" />
                <stop offset="50%" stop-color="#c48a43" />
                <stop offset="100%" stop-color="#9a6229" />
              </linearGradient>
              <!-- Mound Dirt -->
              <radialGradient id="moundGrad" cx="45%" cy="40%" r="55%">
                <stop offset="0%" stop-color="#edd1a2" />
                <stop offset="70%" stop-color="#c48b44" />
                <stop offset="100%" stop-color="#8c5822" />
              </radialGradient>
              <!-- Inner Infield Grass -->
              <linearGradient id="innerGrassGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#268f54" />
                <stop offset="100%" stop-color="#1a683b" />
              </linearGradient>
              <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <!-- Stadium Grass Ground with Center Spotlight -->
            <rect width="320" height="220" fill="url(#fieldGrassGrad)" />

            <!-- Infield Dirt Diamond -->
            <path d="M160 48 L254 133 L160 205 L66 133 Z" fill="url(#infieldDirtGrad)" filter="url(#subtleGlow)" />

            <!-- Base Running Paths (White Chalk Lines connecting the bases) -->
            <line x1="160" y1="202" x2="249" y2="133" stroke="#fffcf2" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
            <line x1="249" y1="133" x2="160" y2="53" stroke="#fffcf2" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
            <line x1="160" y1="53" x2="71" y2="133" stroke="#fffcf2" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
            <line x1="71" y1="133" x2="160" y2="202" stroke="#fffcf2" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

            <!-- Infield Grass Diamond -->
            <path d="M160 74 L224 133 L160 182 L96 133 Z" fill="url(#innerGrassGrad)" />

            <!-- Pitcher's Mound -->
            <circle cx="160" cy="133" r="21" fill="url(#moundGrad)" stroke="#744517" stroke-width="1.5" />
            <rect x="153" y="131" width="14" height="4" rx="1.2" fill="#ffffff" opacity="0.95" />

            <!-- Baseball at Mound Center -->
            <g transform="translate(160, 133)">
              <circle cx="0" cy="0" r="12" fill="#fffcf5" stroke="#87352f" stroke-width="1.6" />
              <path d="M -7 -7 C -3 -3, -3 3, -7 7" fill="none" stroke="#ba3830" stroke-width="1.3" stroke-dasharray="1.8 1.4" stroke-linecap="round" />
              <path d="M 7 -7 C 3 -3, 3 3, 7 7" fill="none" stroke="#ba3830" stroke-width="1.3" stroke-dasharray="1.8 1.4" stroke-linecap="round" />
            </g>

            <!-- Home Plate Circle & Dirt Area -->
            <circle cx="160" cy="202" r="19" fill="url(#infieldDirtGrad)" stroke="#744517" stroke-width="1" />

            <!-- Batter's Boxes (Left & Right Boxes with white chalk) -->
            <rect x="142" y="193" width="7" height="18" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
            <rect x="171" y="193" width="7" height="18" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />

            <!-- Home Plate Shape (Pentagon) -->
            <polygon points="160,196 168,202 168,209 152,209 152,202" fill="#ffffff" stroke="#543312" stroke-width="1.2" />

            <!-- Bases Diamond Shapes (1st, 2nd, 3rd Base Pads) -->
            <g fill="#ffffff" stroke="#683d16" stroke-width="1.8">
              <!-- 2nd Base -->
              <rect x="152" y="45" width="16" height="16" rx="2" transform="rotate(45 160 53)" />
              <!-- 1st Base -->
              <rect x="241" y="125" width="16" height="16" rx="2" transform="rotate(45 249 133)" />
              <!-- 3rd Base -->
              <rect x="63" y="125" width="16" height="16" rx="2" transform="rotate(45 71 133)" />
            </g>
          </svg>

          <!-- Interactive Digit Slots Overlay on Bases (Shown only when filled) -->
          <svg
            class="field-slots"
            id="fieldSlots"
            viewBox="0 0 320 220"
            focusable="false"
            aria-hidden="true"
          >
            <!-- 2nd Base Slot -->
            <g class="digit-slot" data-base="second">
              <circle class="slot-bg" cx="160" cy="53" r="18" />
              <text class="slot-text" x="160" y="53" text-anchor="middle" dominant-baseline="central"></text>
            </g>

            <!-- 1st Base Slot -->
            <g class="digit-slot" data-base="first">
              <circle class="slot-bg" cx="249" cy="133" r="18" />
              <text class="slot-text" x="249" y="133" text-anchor="middle" dominant-baseline="central"></text>
            </g>

            <!-- 3rd Base Slot -->
            <g class="digit-slot" data-base="third">
              <circle class="slot-bg" cx="71" cy="133" r="18" />
              <text class="slot-text" x="71" y="133" text-anchor="middle" dominant-baseline="central"></text>
            </g>

            <!-- Home Plate Slot (for 4 digits) -->
            <g class="digit-slot" data-base="home">
              <circle class="slot-bg" cx="160" cy="202" r="18" />
              <text class="slot-text" x="160" y="202" text-anchor="middle" dominant-baseline="central"></text>
            </g>
          </svg>

          <div class="score-strip" aria-label="현재 게임 상태">
            <div class="score-item">
              <span class="score-label">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="10" />
                  <circle cx="12" cy="12" r="6" />
                  <circle cx="12" cy="12" r="2" />
                </svg>
                남은 기회
              </span>
              <strong id="remainingCount" class="score-value">-</strong>
            </div>
            <div class="score-item">
              <span class="score-label">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                  <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                  <path d="M4 22h16" />
                  <path d="M10 14.66V17c0 .55-.45 1-1 1H8c-.55 0-1 .45-1 1v1h10v-1c0-.55-.45-1-1-1h-1c-.55 0-1-.45-1-1v-2.34" />
                  <path d="M6 4h12v5a6 6 0 0 1-12 0V4z" />
                </svg>
                최고 기록
              </span>
              <strong id="bestScore" class="score-value">-</strong>
            </div>
          </div>

          <div class="result-callout" id="resultCallout">
            <span class="callout-pill">플레이 볼</span>
            <strong class="callout-title">정답을 맞혀보세요</strong>
          </div>
        </div>

        <div class="status-wrap">
          <p class="status-text" id="statusText" role="status" aria-live="polite">
            서로 다른 숫자를 입력하세요.
          </p>
        </div>

        <div class="keypad" id="keypad" aria-label="숫자 키패드"></div>

        <div class="action-row">
          <button class="secondary-button" id="deleteButton" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" />
              <line x1="18" y1="9" x2="12" y2="15" />
              <line x1="12" y1="9" x2="18" y2="15" />
            </svg>
            <span>지우기</span>
          </button>
          <button class="primary-button" id="submitButton" type="button">
            <span>제출하기</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>
      </section>

      <aside class="side-panel" aria-label="게임 기록과 판정">
        <section class="history-panel">
          <div class="panel-heading">
            <h2>기록</h2>
            <div class="panel-heading-actions">
              <div class="rules-tooltip-wrap">
                <button
                  class="text-button"
                  id="rulesButton"
                  type="button"
                  aria-expanded="false"
                  aria-controls="rulesTooltip"
                >
                  판정
                </button>
                <div
                  class="rules-tooltip"
                  id="rulesTooltip"
                  role="dialog"
                  aria-label="판정 규칙"
                  hidden
                >
                  <dl>
                    <div>
                      <dt class="rule-strike">Strike</dt>
                      <dd>숫자와 위치가 모두 맞음</dd>
                    </div>
                    <div>
                      <dt class="rule-ball">Ball</dt>
                      <dd>숫자는 맞고 위치가 다름</dd>
                    </div>
                    <div>
                      <dt class="rule-out">Out</dt>
                      <dd>맞는 숫자가 없음</dd>
                    </div>
                  </dl>
                </div>
              </div>
              <button class="text-button" id="revealButton" type="button">
                정답 보기
              </button>
            </div>
          </div>
          <ol
            class="history-list"
            id="historyList"
            data-empty-text="아직 제출한 숫자가 없습니다."
          ></ol>
        </section>

        <footer class="build-meta" aria-label="빌드 정보">
          <span>
            버전
            <strong id="buildVersion" data-build-version="__BUILD_VERSION__">
              local
            </strong>
          </span>
          <span>
            빌드
            <time id="buildTime" data-build-time="__BUILD_TIME__">-</time>
          </span>
        </footer>
      </aside>
    </main>

    <div
      class="modal-backdrop"
      id="confirmModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmModalMessage"
      hidden
    >
      <div class="modal-card">
        <p class="modal-message" id="confirmModalMessage"></p>
        <div class="modal-actions">
          <button
            class="secondary-button"
            id="confirmModalCancel"
            type="button"
          >
            취소
          </button>
          <button class="primary-button" id="confirmModalOk" type="button">
            확인
          </button>
        </div>
      </div>
    </div>

    <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>

    <script src="script.js"></script>
  </body>
</html>
