<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>윤준영의 숫자 야구</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("number-baseball-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="game-board" aria-label="윤준영의 숫자 야구 게임">
        <div class="topbar">
          <div>
            <h1>윤준영의 숫자 야구</h1>
          </div>
          <div class="topbar-actions">
            <button
              class="icon-button"
              id="themeToggle"
              type="button"
              aria-label="테마 전환"
              title="테마 전환"
              aria-pressed="false"
            >
              <svg
                class="icon-off"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 256 256"
                fill="currentColor"
              >
                <path
                  d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"
                />
              </svg>
              <svg
                class="icon-on"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 256 256"
                fill="currentColor"
              >
                <path
                  d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"
                />
              </svg>
            </button>
            <button
              class="icon-button"
              id="muteToggle"
              type="button"
              aria-label="효과음 끄기"
              title="효과음 끄기"
              aria-pressed="false"
            >
              <svg
                class="icon-off"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 256 256"
                fill="currentColor"
              >
                <path
                  d="M155.51,24.81a8,8,0,0,0-8.42.88L77.25,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V32A8,8,0,0,0,155.51,24.81ZM32,96H72v64H32ZM144,207.64,88,164.09V91.91l56-43.55Zm54-106.08a40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.58,24,24,0,0,0,0-31.72,8,8,0,0,1,12-10.58ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z"
                />
              </svg>
              <svg
                class="icon-on"
                aria-hidden="true"
                focusable="false"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 256 256"
                fill="currentColor"
              >
                <path
                  d="M53.92,34.62A8,8,0,1,0,42.08,45.38L73.55,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V175.09l42.08,46.29a8,8,0,1,0,11.84-10.76ZM32,96H72v64H32ZM144,207.64,88,164.09V95.89l56,61.6Zm42-63.77a24,24,0,0,0,0-31.72,8,8,0,1,1,12-10.57,40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.59Zm-80.16-76a8,8,0,0,1,1.4-11.23l39.85-31A8,8,0,0,1,160,32v74.83a8,8,0,0,1-16,0V48.36l-26.94,21A8,8,0,0,1,105.84,67.91ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <section class="settings-panel">
          <div class="settings-controls">
            <button class="segment is-active" type="button" data-length="3">
              3자리
            </button>
            <button class="segment" type="button" data-length="4">4자리</button>
            <button
              class="segment new-game"
              id="newGameButton"
              type="button"
              aria-label="새 게임"
              title="새 게임"
            >
              새 게임
            </button>
          </div>

          <div class="settings-options">
            <label class="toggle-line">
              <input id="allowZeroToggle" type="checkbox" checked />
              <span>0 포함</span>
            </label>

            <div
              class="radio-group"
              id="attemptsGroup"
              role="radiogroup"
              aria-label="기회"
            >
              <label class="radio-option">
                <input type="radio" name="maxAttempts" value="10" checked />
                <span>10회</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="maxAttempts" value="15" />
                <span>15회</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="maxAttempts" value="20" />
                <span>20회</span>
              </label>
            </div>
          </div>
        </section>

        <div class="field-panel">
          <svg
            class="field-art"
            viewBox="0 17 320 220"
            focusable="false"
            aria-hidden="true"
          >
            <path d="M160 52 L248 132 L160 202 L72 132 Z" fill="#d6a75f" />
            <path d="M160 74 L222 132 L160 181 L98 132 Z" fill="#237d4e" />
            <g fill="#f9f4e7" stroke="#8e5c28" stroke-width="3">
              <rect
                x="151"
                y="44"
                width="18"
                height="18"
                transform="rotate(45 160 53)"
              />
              <rect
                x="240"
                y="124"
                width="18"
                height="18"
                transform="rotate(45 249 133)"
              />
              <rect
                x="151"
                y="193"
                width="18"
                height="18"
                transform="rotate(45 160 202)"
              />
              <rect
                x="62"
                y="124"
                width="18"
                height="18"
                transform="rotate(45 71 133)"
              />
            </g>
            <circle
              cx="160"
              cy="132"
              r="16"
              fill="#f9f4e7"
              stroke="#b63b35"
              stroke-width="3"
            />
            <path
              d="M150 122 C156 128 156 136 150 142"
              fill="none"
              stroke="#b63b35"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M170 122 C164 128 164 136 170 142"
              fill="none"
              stroke="#b63b35"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <svg
            class="field-slots"
            id="fieldSlots"
            viewBox="0 17 320 220"
            focusable="false"
            aria-hidden="true"
          >
            <g class="digit-slot" data-base="home">
              <circle cx="160" cy="202" r="18" />
              <text
                x="160"
                y="202"
                text-anchor="middle"
                dominant-baseline="central"
              ></text>
            </g>
            <g class="digit-slot" data-base="first">
              <circle cx="249" cy="133" r="18" />
              <text
                x="249"
                y="133"
                text-anchor="middle"
                dominant-baseline="central"
              ></text>
            </g>
            <g class="digit-slot" data-base="second">
              <circle cx="160" cy="53" r="18" />
              <text
                x="160"
                y="53"
                text-anchor="middle"
                dominant-baseline="central"
              ></text>
            </g>
            <g class="digit-slot" data-base="third">
              <circle cx="71" cy="133" r="18" />
              <text
                x="71"
                y="133"
                text-anchor="middle"
                dominant-baseline="central"
              ></text>
            </g>
          </svg>
          <div class="score-strip" aria-label="현재 게임 상태">
            <div>
              <span>남은 기회</span>
              <strong id="remainingCount">-</strong>
            </div>
            <div>
              <span>최고 기록</span>
              <strong id="bestScore">-</strong>
            </div>
          </div>
          <div class="result-callout" id="resultCallout">
            <span>플레이 볼</span>
            <strong>정답을 맞혀보세요</strong>
          </div>
        </div>

        <p class="status-text" id="statusText" role="status" aria-live="polite">
          서로 다른 숫자를 입력하세요.
        </p>

        <div class="keypad" id="keypad" aria-label="숫자 키패드"></div>

        <div class="action-row">
          <button class="secondary-button" id="deleteButton" type="button">
            지우기
          </button>
          <button class="primary-button" id="submitButton" type="button">
            제출
          </button>
        </div>
      </section>

      <aside class="side-panel" aria-label="게임 기록과 판정">
        <section class="history-panel">
          <div class="panel-heading">
            <h2>기록</h2>
            <div class="panel-heading-actions">
              <div class="rules-tooltip-wrap">
                <button
                  class="text-button"
                  id="rulesButton"
                  type="button"
                  aria-expanded="false"
                  aria-controls="rulesTooltip"
                >
                  판정
                </button>
                <div
                  class="rules-tooltip"
                  id="rulesTooltip"
                  role="dialog"
                  aria-label="판정 규칙"
                  hidden
                >
                  <dl>
                    <div>
                      <dt class="rule-strike">Strike</dt>
                      <dd>숫자와 위치가 모두 맞음</dd>
                    </div>
                    <div>
                      <dt class="rule-ball">Ball</dt>
                      <dd>숫자는 맞고 위치가 다름</dd>
                    </div>
                    <div>
                      <dt class="rule-out">Out</dt>
                      <dd>맞는 숫자가 없음</dd>
                    </div>
                  </dl>
                </div>
              </div>
              <button class="text-button" id="revealButton" type="button">
                정답 보기
              </button>
            </div>
          </div>
          <ol
            class="history-list"
            id="historyList"
            data-empty-text="아직 제출한 숫자가 없습니다."
          ></ol>
        </section>

        <footer class="build-meta" aria-label="빌드 정보">
          <span>
            버전
            <strong id="buildVersion" data-build-version="__BUILD_VERSION__">
              local
            </strong>
          </span>
          <span>
            빌드
            <time id="buildTime" data-build-time="__BUILD_TIME__">-</time>
          </span>
        </footer>
      </aside>
    </main>

    <div
      class="modal-backdrop"
      id="confirmModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmModalMessage"
      hidden
    >
      <div class="modal-card">
        <p class="modal-message" id="confirmModalMessage"></p>
        <div class="modal-actions">
          <button
            class="secondary-button"
            id="confirmModalCancel"
            type="button"
          >
            취소
          </button>
          <button class="primary-button" id="confirmModalOk" type="button">
            확인
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
